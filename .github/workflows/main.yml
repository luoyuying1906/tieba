name: Build APK

# 推代码自动编译；也可以在 Actions 页面手动点 Run workflow 触发。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # AGP 8.7.2 要求 Gradle >= 8.9
          gradle-version: '8.9'

      # 仓库里的 gradlew/gradlew.bat 是文本脚本，而 gradle-wrapper.jar 是二进制，
      # 无法通过网页上传脚本可靠地获得。这一步用 Gradle 自己把它补齐，
      # 顺便修复 gradlew 可能被 Windows 存成 CRLF 换行的问题。
      # 注意：本工作流实际用 `gradle` 命令编译，不依赖 wrapper，
      # 所以这一步失败也不会影响出 APK（故加了 continue-on-error）。
      - name: 补齐 Gradle Wrapper（含 jar）
        continue-on-error: true
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: 补齐 Android SDK 组件
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager")"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null 2>&1 || true
            echo "SDK 组件就绪"
          else
            echo "未找到 sdkmanager，跳过（GitHub runner 镜像通常已预装 API 35）"
          fi

      # 关键：这里用 `gradle` 而不是 `./gradlew`。
      # GitHub 自带的 "Android CI" 模板用的是 ./gradlew，所以才会报 chmod: gradlew 不存在。
      - name: 编译 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: tieba-search-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
